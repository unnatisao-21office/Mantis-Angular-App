
<section class="min-h-screen px-4 pb-20 pt-12 flex items-start justify-center bg-white,#f8fafc]">
    <div class="w-full max-w-4xl bg-white border-3 border-blue-200 rounded-2xl px-10 py-12 shadow-xl">
        <p class="text-center text-blue-500 font-semibold tracking-wide text-sm mb-2">Get in touch</p>
        <h1 class="text-center text-3xl md:text-4xl font-semibold text-slate-900">Send us your message</h1>
        <p class="text-center max-w-xl mx-auto mt-3 mb-9 text-slate-500 text-sm leading-6">
            The starting point for your next project based on easy-to-customize
            Material-UI helps you build apps faster and better.
        </p>

        <form class="flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <input type="text" name="name" placeholder="Name" aria-label="Name" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400" />
                </div>
                <div>
                    <input type="text" name="company" placeholder="Company Name" aria-label="Company Name" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400" />
                </div>
                <div>
                    <input type="email" name="email" placeholder="Email address" aria-label="Email address" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400" />
                </div>
                <div>
                    <input type="tel" name="phone" placeholder="Phone Number" aria-label="Phone Number" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400" />
                </div>
                <div>
                    <select name="employees" aria-label="Employees" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
                        <option selected>1-5</option>
                        
                        <option>11-25</option>
                        <option>26-50</option>
                        <option>51+</option>
                    </select>
                </div>
                <div>
                    <select name="budget" aria-label="Budget" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400">
                        <option selected>Below $1000</option>
                        <option>$1000 - $5000</option>
                        <option>$5000 - $10000</option>
                        <option>$10000+</option>
                    </select>
                </div>
            </div>

            <div>
                <textarea name="message" rows="5" placeholder="Message" aria-label="Message" class="w-full rounded-lg border border-blue-200 px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 resize-y min-h-[140px]"></textarea>
            </div>

            <label class="flex items-start gap-3 text-xs text-slate-600">
                <input type="checkbox" checked class="mt-1 h-4 w-4 accent-blue-500" />
                <span class="leading-5">
                    By submitting this, you agree to the
                    <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a> and
                    <a href="#" class="text-blue-600 hover:underline">Cookie Policy</a>
                </span>
            </label>

            <div class="flex justify-end">
                <button type="submit" class="bg-blue-600 text-white font-semibold px-7 py-3 rounded-lg shadow hover:bg-blue-700 transition">Submit Now</button>
            </div>
        </form>
    </div>
</section>
