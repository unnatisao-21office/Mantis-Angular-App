<div class="flex justify-center items-start min-h-screen min-w-screen bg-transparent px-4 py-6">
    <div
        class="bg-white border-3 border-blue-200 shadow-xl rounded-xl p-5 w-lg max-w-xs sm:max-w-md md:max-w-lg lg:max-w-xl">
        <h1 class="text-4xl md:text-4xl text-gray-600 font-bold text-center mb-6">Coming Soon</h1>
        <p class="text-gray-500 text-sm text-center mb-6">Something new is on its way</p>
        
       
        <div class="flex justify-center gap-4 mb-8">
            <div class="text-center">
                <div class="text-3xl font-bold text-gray-800">{{days}}</div>
                <div class="text-sm text-gray-500">day</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-bold text-gray-800">{{hours}}</div>
                <div class="text-sm text-gray-500">hour</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-bold text-gray-800">{{minutes}}</div>
                <div class="text-sm text-gray-500">min</div>
            </div>
            <div class="text-center">
                <div class="text-3xl font-bold text-gray-800">{{seconds}}</div>
                <div class="text-sm text-gray-500">sec</div>
            </div>
        </div>
        
        <div class="flex gap-4 mb-4">
            <div class="flex-[2]">
                <label class="block text-gray-700 font-semibold mb-2">Email Address</label>
                <input type="email" class="w-full border border-gray-300 rounded px-4 py-2"
                    placeholder="Email Address" />

            </div>
            <div class="flex-1 flex items-end">
                <button
                    class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600 transition duration-300">
                    Notify Me
                </button>
            </div>
        </div>

    </div>
</div>
