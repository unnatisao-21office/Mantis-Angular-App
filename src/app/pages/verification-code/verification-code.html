<div class="flex justify-center items-center min-h-screen bg-gray-50 px-4">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Enter Verification Code</h1>
            <p class="text-gray-600 text-sm mb-4">We send you on mail.</p>
            <p class="text-gray-700 text-sm">We've send you code on jone. <span class="font-semibold">****@company.com</span></p>
        </div>

        <div class="flex justify-between gap-3 mb-6">
            <input 
                #code1
                type="text" 
                maxlength="1" 
                
                class="w-16 h-16 text-center text-2xl font-semibold border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition"
            />
            <input 
                #code2
                type="text" 
                maxlength="1" 
              
                class="w-16 h-16 text-center text-2xl font-semibold border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition"
            />
            <input 
                #code3
                type="text" 
                maxlength="1" 
                
                class="w-16 h-16 text-center text-2xl font-semibold border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition"
            />
            <input 
                #code4
                type="text" 
                maxlength="1" 
                
                class="w-16 h-16 text-center text-2xl font-semibold border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none transition"
            />
        </div>

        <button 
            
            class="w-full bg-blue-500 text-white font-semibold py-3 rounded-lg hover:bg-blue-600 transition duration-300 mb-4"
        >
            Continue
        </button>

        <div class="text-center text-sm text-gray-600">
            <span>Did not receive the email? Check your spam filter, or </span>
            <button 
                (click)="resendCode()"
                class="text-blue-500 hover:text-blue-700 font-semibold"
            >
                Resend code
            </button>
        </div>
    </div>
</div>
